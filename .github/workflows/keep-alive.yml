name: Keep Render Alive

on:
  schedule:
    # Every 4 minutes (keeps Render from sleeping after 15 min)
    - cron: '*/4 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging health endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://dmarc-pipeline.onrender.com/health)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Service is alive"
          else
            echo "⚠️ Service returned $HTTP_CODE"
          fi
