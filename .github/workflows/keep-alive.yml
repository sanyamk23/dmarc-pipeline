name: Keep Render Alive

on:
  schedule:
    # Every 5 minutes (GitHub minimum)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # Also run on push to main for testing
  push:
    branches:
      - main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          echo "🕐 Ping at $(date -u)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://dmarc-pipeline.onrender.com/health)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Service is alive"
          else
            echo "⚠️ Service returned $HTTP_CODE"
            exit 1
          fi
